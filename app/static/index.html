<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hey Alex">
<title>Hey Alex</title>
<link rel="icon" href="/static/favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png" sizes="180x180">
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efede7; --line: #e3e0d8;
  --ink: #1d1f21; --ink-2: #5c6168; --ink-3: #8b9097;
  --accent: #2f6f5e; --accent-ink: #ffffff; --accent-soft: #dcefe7;
  --user: #e3eee9;
  --err: #c2412d; --err-soft: #fbe4de;
  --ok: #2f7d4f; --ok-soft: #e0f2e6;
  --warn: #9a6412; --warn-soft: #f8ecd6;
  --bar: #2f6f5e;
  --shadow: 0 1px 2px #0000000d, 0 6px 24px #00000010;
  --radius: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121416; --surface: #1b1e21; --surface-2: #24282c; --line: #2e3338;
    --ink: #eceae4; --ink-2: #a6abb1; --ink-3: #7a8087;
    --accent: #7fd1b3; --accent-ink: #0f1a16; --accent-soft: #1d332b;
    --user: #1f302a;
    --err: #ff8a73; --err-soft: #3a221d;
    --ok: #7fd19a; --ok-soft: #1c3324;
    --warn: #f0b75e; --warn-soft: #3a2e1a;
    --bar: #7fd1b3;
    --shadow: 0 1px 2px #0000004d, 0 8px 28px #00000059;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { opacity: .45; cursor: default; }
textarea, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- scrollbars ---------- */
:root { --scroll-thumb: color-mix(in srgb, var(--accent) 42%, var(--surface-2)); --scroll-thumb-hover: color-mix(in srgb, var(--accent) 72%, var(--surface-2)); }
:where(.messages, .view, .sheet, textarea) { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
@supports selector(::-webkit-scrollbar) {
  :where(.messages, .view, .sheet, textarea) { scrollbar-width: auto; scrollbar-color: auto; }
  :where(.messages, .view, .sheet, textarea)::-webkit-scrollbar { width: 8px; height: 8px; }
  :where(.messages, .view, .sheet, textarea)::-webkit-scrollbar-track { background: transparent; }
  :where(.messages, .view, .sheet, textarea)::-webkit-scrollbar-thumb { min-height: 36px; border: 2px solid transparent; border-radius: 99px; background: var(--scroll-thumb); background-clip: padding-box; }
  :where(.messages, .view, .sheet, textarea)::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-thumb-hover); }
  :where(.messages, .view, .sheet, textarea)::-webkit-scrollbar-thumb:active { background-color: var(--accent); }
  :where(.messages, .view, .sheet, textarea)::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  :where(.messages, .view, .sheet, textarea)::-webkit-scrollbar-corner { background: transparent; }
}

/* ---------- shell ---------- */
.app { height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; max-width: 640px; margin: 0 auto; }
.topbar { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; min-height: 56px; }
.topbar h1 { font-size: 19px; font-weight: 750; letter-spacing: -.03em; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar h1 small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }
#backBtn { margin-left: -8px; }
.pill-btn { height: 34px; padding: 0 14px; border-radius: 99px; background: var(--surface-2); font-size: 14px; font-weight: 600; flex: none; }
.streak { font-size: 13px; font-weight: 700; color: var(--warn); background: var(--warn-soft); border-radius: 99px; padding: 4px 10px; flex: none; }
main { min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px 24px; }
.view.chat-view { padding: 0; display: flex; flex-direction: column; overflow: hidden; }
.tabbar { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--bg); padding-bottom: var(--safe-b); }
.tabbar button { height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-3); position: relative; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-selected="true"] { color: var(--accent); }
.tabbar .badge { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--err); color: #fff; font-size: 11px; line-height: 18px; }
body.typing .tabbar { display: none; }

/* ---------- common ---------- */
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.section-title { font-size: 13px; font-weight: 700; color: var(--ink-3); margin: 22px 4px 10px; letter-spacing: .02em; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.err { background: var(--err-soft); color: var(--err); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.btn { height: 48px; padding: 0 20px; border-radius: 14px; font-weight: 700; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.block { width: 100%; }
.btn.small { height: 36px; padding: 0 12px; border-radius: 10px; font-size: 14px; }
.mini { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--ink-2); background: var(--surface-2); }
.mini svg { width: 16px; height: 16px; }
.mini.recording { background: var(--err); color: #fff; }
.muted { color: var(--ink-3); }
.toast { position: fixed; left: 50%; bottom: calc(96px + var(--safe-b)); transform: translateX(-50%); max-width: min(560px, calc(100% - 32px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 50; box-shadow: var(--shadow); }
.dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

/* ---------- home ---------- */
.hello { margin: 8px 4px 16px; }
.hello h2 { font-size: 26px; letter-spacing: -.04em; margin: 0 0 4px; line-height: 1.25; }
.hello p { margin: 0; color: var(--ink-2); font-size: 15px; }
.focus-card { display: grid; gap: 10px; }
.focus-card .row { display: flex; flex-wrap: wrap; gap: 6px; }
.focus-card p { margin: 0; font-size: 14px; color: var(--ink-2); }
.review-nudge { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin-top: 12px; }
.review-nudge .num { width: 44px; height: 44px; border-radius: 12px; background: var(--err-soft); color: var(--err); display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; }
.review-nudge b { display: block; }
.review-nudge span { font-size: 13px; color: var(--ink-3); }
.topics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.topic { background: var(--surface); border-radius: 16px; padding: 14px; text-align: left; box-shadow: var(--shadow); min-height: 84px; display: flex; flex-direction: column; justify-content: space-between; }
.topic .emoji { font-size: 22px; }
.topic b { font-size: 15px; }
.topic.wide { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; gap: 12px; justify-content: flex-start; background: var(--accent); color: var(--accent-ink); }
.topic.wide small { display: block; font-size: 12px; opacity: .8; font-weight: 500; }
.topic:active { transform: scale(.98); }
.resume-chat { width: 100%; display: flex; align-items: center; gap: 12px; margin-bottom: 16px; text-align: left; border: 1px solid var(--accent-soft); }
.resume-chat img { width: 48px; height: 48px; object-fit: cover; border-radius: 16px; }
.resume-chat .copy { flex: 1; min-width: 0; }
.resume-chat b, .resume-chat small { display: block; }
.resume-chat small { color: var(--ink-2); margin-top: 2px; }
.resume-chat .arrow { color: var(--accent); font-size: 24px; }

/* ---------- chat ---------- */
.messages { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px 14px calc(var(--composer-space, 138px) + 12px); scroll-padding-bottom: calc(var(--composer-space, 138px) + 12px); display: flex; flex-direction: column; gap: 16px; }
.messages > .msg { flex-shrink: 0; }
.msg { max-width: 100%; display: flex; flex-direction: column; gap: 6px; }
.msg.tutor { align-self: flex-start; display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 9px; align-items: start; }
.message-avatar { width: 40px; height: 40px; object-fit: cover; border-radius: 15px; background: #eee5d6; }
.message-content { grid-column: 2; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
.sender-name { font-size: 12px; font-weight: 600; color: var(--ink); padding-left: 2px; text-shadow: 0 1px 3px var(--bg); }
.msg.tutor.continuation { margin-top: -10px; }
.msg.tutor.continuation .message-content { grid-column: 2; }
.msg.tutor.continuation .bubble { border-top-left-radius: 10px; }
.msg.user { align-self: flex-end; align-items: flex-end; max-width: calc(100% - 49px); }
.bubble { padding: 11px 14px; border-radius: 10px; font-size: 16px; line-height: 1.45; overflow-wrap: anywhere; position: relative; }
.tutor .bubble { background: var(--surface); box-shadow: 0 1px 2px #00000014; }
.tutor:not(.continuation) .bubble::before { content: ''; position: absolute; top: 9px; left: -7px; border-top: 0 solid transparent; border-bottom: 9px solid transparent; border-right: 8px solid color-mix(in srgb, var(--surface) 96%, transparent); }
.msg.user > .bubble::after { content: ''; position: absolute; top: 9px; right: -7px; border-top: 0 solid transparent; border-bottom: 9px solid transparent; border-left: 8px solid var(--user); }
/* The wallpaper stays still while messages scroll above it. */
.view.chat-view { isolation: isolate; background: var(--surface-2); --user: #fee500; }
.chat-wallpaper { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; z-index: -2; }
.chat-view::before { content: ''; position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 35%, transparent); z-index: -1; pointer-events: none; }
.feedback-focus { font-size: 12px; color: var(--accent); font-weight: 650; padding: 2px 4px; text-align: left; }
.more-corrections { min-width: 0; text-align: left; }
.more-corrections > summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 8px 12px; border-radius: 12px; background: color-mix(in srgb, var(--surface) 94%, transparent); color: var(--ink-2); font-size: 13px; cursor: pointer; list-style: none; }
.more-corrections > summary::-webkit-details-marker { display: none; }
.more-corrections > summary::after { content: '⌄'; font-size: 18px; transition: transform .15s; }
.more-corrections[open] > summary::after { transform: rotate(180deg); }
.more-corrections > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.more-corrections:not([open]) .more-corrections-body { display: none; }
.more-corrections-body { display: grid; gap: 8px; padding-top: 8px; }
.chat-view .tutor .bubble, .chat-view .corr { background: color-mix(in srgb, var(--surface) 96%, transparent); }
.chat-view .user > .bubble { background: var(--user); color: #29251a; }
.chat-view .composer { position: absolute; inset: auto 0 0; z-index: 2; background: transparent; border: 0; pointer-events: none; }
.composer button, .composer textarea { pointer-events: auto; }
.speaking-guide { background: color-mix(in srgb, var(--surface) 96%, transparent); border: 1px solid var(--accent); border-radius: 14px; padding: 12px; text-align: left; box-shadow: var(--shadow); }
.speaking-guide .label { font-size: 13px; font-weight: 700; color: var(--accent); }
.speaking-guide p { margin: 6px 0; }
.speaking-guide .guide-hint { font-size: 12px; color: var(--ink-2); }
.speaking-guide .guide-example { font-size: 16px; line-height: 1.5; }
.guide-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.user .bubble { background: var(--user); border-bottom-right-radius: 6px; }
.tutor .bubble.veiled .text { filter: blur(6px); user-select: none; }
.tutor .bubble .veil-hint { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.msg-actions { display: flex; gap: 6px; padding-left: 4px; }
.msg-actions .mini { height: 28px; font-size: 12px; background: transparent; color: var(--ink-3); padding: 0 6px; }
.msg-actions .mini.playing { color: var(--accent); }
.user .bubble mark { background: var(--err-soft); color: inherit; border-radius: 4px; padding: 0 2px; text-decoration: underline wavy var(--err); text-decoration-skip-ink: none; text-underline-offset: 3px; cursor: pointer; }
.voice-tag { font-size: 11px; color: var(--ink-3); display: flex; align-items: center; gap: 4px; padding-right: 4px; }
.feedback { width: 100%; min-width: min(320px, calc(100vw - 77px)); display: grid; gap: 8px; }
.fb-pending { font-size: 13px; color: var(--ink-3); padding: 2px 6px; text-align: right; }
.fb-ok { font-size: 13px; color: var(--ok); font-weight: 650; padding: 2px 6px; text-align: right; }
.corr { background: var(--surface); border-radius: 14px; padding: 12px 12px 10px; box-shadow: var(--shadow); border-left: 3px solid var(--err); }
.corr.unnatural { border-left-color: var(--warn); }
.corr.gap { border-left-color: var(--accent); }
.corr.flash { animation: flash 1s; }
@keyframes flash { 30% { background: var(--err-soft); } }
.corr-head { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.corr-line { font-size: 16px; line-height: 1.4; }
.corr-line s { color: var(--err); text-decoration-thickness: 1.5px; }
.corr-line .arrow { color: var(--ink-3); margin: 0 4px; }
.corr-line b { color: var(--ok); font-weight: 700; }
.corr .why { font-size: 14px; color: var(--ink-2); margin: 6px 0 8px; }
.corr-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.attempt { font-size: 13px; margin-top: 8px; padding: 8px 10px; border-radius: 10px; }
.attempt.good { background: var(--ok-soft); color: var(--ok); }
.attempt.bad { background: var(--err-soft); color: var(--ink); }
.attempt .heard { color: var(--ink-2); display: block; }
.attempt button { text-decoration: underline; font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.natural { background: var(--accent-soft); border-radius: 14px; padding: 10px 12px; display: flex; gap: 8px; align-items: flex-start; }
.natural .label { font-size: 12px; font-weight: 700; color: var(--accent); display: block; }
.natural p { margin: 0; font-size: 15px; flex: 1; }
.natural .mini { background: transparent; color: var(--accent); flex: none; }
.good-use { font-size: 13px; color: var(--ok); padding: 0 6px; text-align: right; }
.failed { font-size: 13px; color: var(--err); text-align: right; }
.failed button { text-decoration: underline; color: var(--err); font-size: 13px; margin-left: 6px; }

.composer { padding: 8px 14px 10px; }
.status-line { width: fit-content; max-width: 100%; margin: 0 auto 8px; padding: 5px 12px; border-radius: 99px; background: color-mix(in srgb, var(--surface) 94%, transparent); box-shadow: var(--shadow); font-size: 13px; color: var(--ink-2); text-align: center; }
.status-line:empty { display: none; }
.voice-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; justify-items: center; min-height: 96px; }
.voice-row .round { background: color-mix(in srgb, var(--surface) 96%, transparent); box-shadow: var(--shadow); border: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.voice-row #toKeyboard { justify-self: start; color: var(--ink-2); }
.voice-row #toKeyboard[aria-expanded="true"] { color: var(--accent); background: var(--accent-soft); }
.voice-row #cancelRec { justify-self: end; }
.voice-row #toKeyboard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mic { --level: 0; width: 80px; height: 80px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 4px 18px color-mix(in srgb, var(--accent) 40%, transparent); position: relative; transition: transform .1s; }
.mic svg { width: 30px; height: 30px; position: relative; }
.mic:active { transform: scale(.95); }
.mic.recording { background: var(--err); color: #fff; }
.mic.recording::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid var(--err); opacity: .35; transform: scale(calc(1 + var(--level) * .45)); transition: transform .08s; }
.mic.working { background: var(--surface-2); color: var(--ink-3); box-shadow: none; }
.text-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 8px; }
.text-row textarea { flex: 1; min-width: 0; resize: none; max-height: 30dvh; min-height: 46px; padding: 11px 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); outline: none; font-size: 16px; line-height: 1.4; }
.text-row textarea:focus { border-color: var(--accent); }
.round { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); flex: none; }
.round.primary { background: var(--accent); color: var(--accent-ink); }
.round svg { width: 22px; height: 22px; }

/* ---------- sheets ---------- */
.sheet-backdrop { position: fixed; inset: 0; background: #0006; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 88dvh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 10px 18px calc(22px + var(--safe-b)); }
.sheet::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet h2 { margin: 0 0 14px; font-size: 20px; letter-spacing: -.03em; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.field:last-of-type { border-bottom: 0; }
.field label, .field .name { font-weight: 600; }
.field small { display: block; font-size: 12px; color: var(--ink-3); font-weight: 400; }
.field select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; max-width: 50%; }
.field input[type=range] { width: 46%; accent-color: var(--accent); }
.segmented { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.segmented button { padding: 6px 11px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.switch { appearance: none; width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; flex: none; cursor: pointer; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0003; transition: transform .15s; }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(20px); }

.report-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.stat { background: var(--surface); border-radius: 14px; padding: 10px 8px; text-align: center; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 22px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--ink-3); }
.summary-note { background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; font-size: 15px; margin-bottom: 14px; }
.report-list { display: grid; gap: 8px; margin-bottom: 16px; }
.report-item { background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.report-item .corr-line { font-size: 15px; }
.report-item .why { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------- review ---------- */
.review-top { display: flex; align-items: center; justify-content: space-between; margin: 8px 4px 12px; font-size: 14px; color: var(--ink-3); }
.progress-track { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin: 0 4px 14px; }
.progress-track div { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.rv-card { display: grid; gap: 14px; }

.rv-prompt { font-size: 14px; color: var(--ink-2); font-weight: 600; }
.rv-context { font-size: 19px; line-height: 1.5; letter-spacing: -.01em; }
.rv-context mark { background: var(--err-soft); color: inherit; border-radius: 4px; padding: 0 3px; text-decoration: underline wavy var(--err); text-underline-offset: 4px; text-decoration-skip-ink: none; }
.rv-korean { font-size: 26px; font-weight: 750; letter-spacing: -.03em; }

<script>
'use strict';
const $ = s => document.querySelector(s);
const ICON = {
  speaker: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>',
  slow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
};
const TOPIC_EMOJI = { free: '💬', day: '☀️', work: '💼', hobby: '🎸', travel: '✈️', opinion: '💡', cafe: '☕', interview: '🤝', focus: '🎯' };
const STATUS = { focus: ['집중 필요', 'err'], watch: ['관찰 중', 'warn'], improving: ['좋아지는 중', 'ok'], stable: ['안정', ''] };
const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';

const state = { boot: null, tab: 'talk', session: null, chatOpen: false, chatVisited: false, busy: false, review: null };
const initialView = history.state?.heyAlex ? history.state.view : location.hash.slice(1);
const homeUrl = location.pathname + location.search;

// ------------------------------------------------------------ helpers
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) node.append(c instanceof Node ? c : String(c));
  return node;
}
async function api(path, options = {}) {
  const init = { ...options };
  if (options.json !== undefined) {
    init.method = init.method || 'POST';
    init.headers = { 'Content-Type': 'application/json' };
    init.body = JSON.stringify(options.json);
  }
  const res = await fetch(path, init);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `요청 실패 (${res.status})`);
  return data;
}
async function readEvents(response, onEvent) {
  const reader = response.body.getReader(), decoder = new TextDecoder();
  let buffer = '';
  for (;;) {
    const { value, done } = await reader.read();
    buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
    let split;
    while ((split = buffer.indexOf('\n\n')) >= 0) {
      const block = buffer.slice(0, split); buffer = buffer.slice(split + 2);
      let event = 'message'; const data = [];
      for (const line of block.split('\n')) {
        if (line.startsWith('event:')) event = line.slice(6).trim();
        else if (line.startsWith('data:')) data.push(line.slice(5).trim());
      }
      if (data.length) await onEvent(event, JSON.parse(data.join('\n')));
    }
    if (done) break;
  }
}
let toastTimer;
function toast(message, ms = 3500) {
  const t = $('#toast'); t.textContent = message; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), ms);
}
const catLabel = c => state.boot?.categories?.[c] || c;
function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
function load(key, fallback) { try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; } }
/** Wrap the first occurrence of each phrase in <mark>, building DOM nodes (never innerHTML). */
function highlight(text, phrases, onClick) {
  const lower = text.toLowerCase(), ranges = [];
  phrases.forEach((p, i) => {
    if (!p) return;
    const at = lower.indexOf(p.toLowerCase());
    if (at >= 0 && !ranges.some(r => at < r.end && at + p.length > r.start)) ranges.push({ start: at, end: at + p.length, i });
  });
  ranges.sort((a, b) => a.start - b.start);
  const frag = document.createDocumentFragment(); let pos = 0;
  for (const r of ranges) {
    frag.append(text.slice(pos, r.start));
    frag.append(el('mark', { onclick: onClick ? () => onClick(r.i) : null }, text.slice(r.start, r.end)));
    pos = r.end;
  }
  frag.append(text.slice(pos));
  return frag;
}

// ------------------------------------------------------------ settings
const settings = Object.assign({ level: 'intermediate', speak: true, voice: '', speed: 1, veil: false, autoSend: true }, load('sf.settings', {}));
if (!(settings.speed >= 0.6 && settings.speed <= 1.4)) settings.speed = 1;
function saveSettings() { store('sf.settings', settings); }
function renderSettings() {
  document.querySelectorAll('#levelSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.level === settings.level)));
  $('#optSpeak').checked = settings.speak;
  $('#optVeil').checked = settings.veil;
  $('#optAutoSend').checked = settings.autoSend;
  $('#optRate').value = settings.speed;
  $('#rateLabel').textContent = `${settings.speed.toFixed(2)}×`;
  const voices = state.boot?.voices || [];
  const sel = $('#optVoice'); sel.replaceChildren(...voices.map(v => el('option', { value: v.id }, v.label)));
  sel.value = currentVoice();
}
function currentVoice() {
  const ids = (state.boot?.voices || []).map(v => v.id);
  return ids.includes(settings.voice) ? settings.voice : (state.boot?.default_voice || ids[0] || '');
}
$('#settingsBtn').onclick = () => { renderSettings(); openSheet('#settingsSheet'); };
$('#levelSeg').onclick = e => { const b = e.target.closest('button'); if (b) { settings.level = b.dataset.level; saveSettings(); renderSettings(); } };
$('#optSpeak').onchange = e => { settings.speak = e.target.checked; saveSettings(); if (!settings.speak) stopAudio(); };
$('#optVeil').onchange = e => { settings.veil = e.target.checked; saveSettings(); };
$('#optAutoSend').onchange = e => { settings.autoSend = e.target.checked; saveSettings(); };
$('#optVoice').onchange = e => { settings.voice = e.target.value; saveSettings(); playTts('Hi, this is how I sound.'); };
$('#optRate').oninput = e => { settings.speed = Number(e.target.value); $('#rateLabel').textContent = `${settings.speed.toFixed(2)}×`; saveSettings(); };
$('#optRate').onchange = () => playTts('This is my speaking speed.');

function openSheet(sel) { $(sel).hidden = false; }
function closeSheet(sel) { $(sel).hidden = true; }
document.querySelectorAll('.sheet-backdrop').forEach(bd => bd.addEventListener('click', e => {
  if (e.target === bd || e.target.closest('[data-close]')) bd.hidden = true;
}));
window.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.sheet-backdrop').forEach(b => (b.hidden = true)); });

// ------------------------------------------------------------ audio out (local TTS)
// iOS only lets an <audio> element play without a gesture after it has played once from one.
const player = new Audio();
let audioUnlocked = false, playingButton = null, playbackVersion = 0;
const ttsCache = new Map();
document.addEventListener('pointerdown', () => {
  if (audioUnlocked) return;
  audioUnlocked = true; player.src = SILENT_WAV; player.play().catch(() => {});
}, true);
player.addEventListener('ended', () => setPlaying(null));
player.addEventListener('pause', () => setPlaying(null));
function setPlaying(button) { playingButton?.classList.remove('playing'); playingButton = button; button?.classList.add('playing'); }
function stopAudio() { playbackVersion++; player.pause(); setPlaying(null); }
async function playTts(text, { speed = settings.speed, button = null } = {}) {
  stopAudio();
  const version = playbackVersion;
  const voice = currentVoice();
  const key = `${voice}|${text}`;
  try {
    let url = ttsCache.get(key);
    if (!url) {
      const res = await fetch('/api/speech', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, voice }) });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || '음성 합성 실패');
      url = URL.createObjectURL(await res.blob());
      if (ttsCache.size > 40) { const [k, u] = ttsCache.entries().next().value; URL.revokeObjectURL(u); ttsCache.delete(k); }
      ttsCache.set(key, url);
    }
    if (version !== playbackVersion) return;
    player.src = url;
    player.preservesPitch = true; player.webkitPreservesPitch = true;
    player.defaultPlaybackRate = player.playbackRate = speed;
    await player.play();
    if (version === playbackVersion) setPlaying(button);
  } catch (e) {
    if (version === playbackVersion && e.name !== 'AbortError' && e.name !== 'NotAllowedError') toast(e.message);
  }
}
function speakerButton(text, label = '') {
  const b = el('button', { class: 'mini', type: 'button', 'aria-label': `${text} 듣기`, html: ICON.speaker });
  if (label) b.append(label);
  b.onclick = () => playTts(text, { button: b });
  return b;
}

// ------------------------------------------------------------ audio in (record → local Whisper)
let capture = null; // { owner, stop, cancel, timer }
async function startRecording(owner, onLevel) {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  const mime = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'].find(t => window.MediaRecorder?.isTypeSupported?.(t)) || '';
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  let ctx = null, frame = 0;
  if (onLevel) {
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const analyser = ctx.createAnalyser(); analyser.fftSize = 512;
      ctx.createMediaStreamSource(stream).connect(analyser);
      const buf = new Uint8Array(analyser.fftSize);
      const tick = () => {
        analyser.getByteTimeDomainData(buf);
        let sum = 0; for (const v of buf) { const d = (v - 128) / 128; sum += d * d; }
        onLevel(Math.min(1, Math.sqrt(sum / buf.length) * 5));
        frame = requestAnimationFrame(tick);
      };
      tick();
    } catch {}
  }
  const cleanup = () => { cancelAnimationFrame(frame); ctx?.close().catch(() => {}); stream.getTracks().forEach(t => t.stop()); clearTimeout(capture?.timer); capture = null; };
  const started = performance.now();
  rec.start();
  capture = {
    owner,
    stop: () => new Promise(resolve => {
      rec.onstop = () => { cleanup(); resolve({ blob: new Blob(chunks, { type: rec.mimeType || mime || 'audio/webm' }), seconds: (performance.now() - started) / 1000 }); };
      rec.stop();
    }),
    cancel: () => { if (rec.state === 'inactive') return; rec.onstop = cleanup; owner.classList.remove('recording'); capture?.onState?.('idle'); rec.stop(); },
  };
  capture.timer = setTimeout(() => capture?.owner === owner && owner.click(), 90_000);
  return capture;
}
async function transcribe(blob) {
  const ext = blob.type.includes('mp4') ? 'm4a' : blob.type.includes('ogg') ? 'ogg' : 'webm';
  const fd = new FormData(); fd.append('audio', blob, `speech.${ext}`);
  return api('/api/transcribe', { method: 'POST', body: fd });
}
/**
 * Toggle recording for a button. First tap starts, second tap stops and transcribes.
 * onText receives { text, speaking_seconds }.
 */
async function toggleCapture(button, onText, { onLevel, onState } = {}) {
  if (capture && capture.owner !== button) { capture.cancel(); }
  if (capture?.owner === button) {

  if (document.activeElement === input) input.blur();

}
$('#toKeyboard').onclick = () => {
  if ($('#textRow').hidden) { showKeyboard(); input.focus(); }
  else showVoice();
};
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.3) + 'px'; }
input.addEventListener('input', autosize);
input.addEventListener('focus', () => document.body.classList.add('typing'));
input.addEventListener('blur', () => setTimeout(() => document.body.classList.remove('typing'), 150));
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#textRow').requestSubmit(); } });
$('#textRow').onsubmit = e => {
  e.preventDefault();
  const seconds = Number(input.dataset.seconds) || null;
  const text = input.value;
  if (!text.trim() || state.busy) return;
  input.value = ''; delete input.dataset.seconds; autosize();
  showVoice();
  sendTurn(text, seconds);
};
// Let the transcript reach the bottom of the wallpaper, with only enough
// scroll space to keep the latest message above the floating voice controls.
const composerObserver = new ResizeObserver(entries => {
  const height = entries[0].target.getBoundingClientRect().height;
  if (!height) return;
  const messages = $('#messages');
  const atBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 64;
  $('#chatView').style.setProperty('--composer-space', height + 'px');
  if (atBottom) scrollChat();
});
composerObserver.observe($('.composer'));

// ------------------------------------------------------------ end of session report

// ------------------------------------------------------------ review
async function loadReview() {
  const view = $('#reviewView');
  view.replaceChildren(el('p', { class: 'muted dots', style: 'text-align:center;margin-top:40px' }, '불러오는 중'));
  try {
    const { cards } = await api('/api/review');
    state.review = { cards, i: 0, right: 0, answered: false };
    renderReview();
  } catch (e) { view.replaceChildren(el('div', { class: 'empty' }, el('p', {}, e.message))); }
}
function renderReview() {
  const view = $('#reviewView'), rv = state.review;
  updateReviewBadge(Math.max(0, rv.cards.length - rv.i));
  if (!rv.cards.length || rv.i >= rv.cards.length) {
    const done = rv.cards.length > 0;
    view.replaceChildren(el('div', { class: 'empty' },
      el('div', { class: 'big' }, done ? '🎉' : '✨'),
      el('h3', {}, done ? `복습 완료! ${rv.cards.length}개 중 ${rv.right}개 정답` : '지금 복습할 문장이 없어요'),
      el('p', {}, done ? '틀린 문장은 몇 분 뒤 다시 나와요. 맞힌 문장은 점점 간격을 두고 다시 확인해요.' : '대화하면서 교정받은 표현이 여기에 모여요. 맞힐수록 1일 → 3일 → 7일… 간격으로 다시 나와요.'),
      el('button', { class: 'btn primary', type: 'button', onclick: () => setTab('talk') }, '대화하러 가기')));
    return;
  }
  const c = rv.cards[rv.i];
  rv.answered = false;
  const isGap = c.category === 'expression_gap';
  const hint = el('div', { class: 'rv-hint' }, c.explain_ko || '힌트가 없어요');
  hint.hidden = true;
  const resultBox = el('div');
  const reviewMic = el('button', { class: 'mic', type: 'button', 'aria-label': '답 말하기', html: ICON.mic });
  const textInput = el('textarea', { rows: 1, placeholder: '또는 입력하기', 'aria-label': '답 입력', enterkeyhint: 'done' });
  const answerArea = el('div', { class: 'rv-answer' },
    reviewMic,
    el('form', { class: 'text-row', onsubmit: e => { e.preventDefault(); if (textInput.value.trim()) submitReview(c, textInput.value.trim(), resultBox, answerArea); } },
      textInput, el('button', { class: 'round primary', type: 'submit', 'aria-label': '확인', html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg>' })),
    el('div', { class: 'rv-links' },
      el('button', { type: 'button', onclick: () => (hint.hidden = !hint.hidden) }, '힌트'),
      el('button', { type: 'button', onclick: () => giveUp(c, resultBox, answerArea) }, '모르겠어요')));
  reviewMic.onclick = () => toggleCapture(reviewMic, async ({ text }) => {
    reviewMic.classList.remove('working'); reviewMic.innerHTML = ICON.mic;
    await submitReview(c, text, resultBox, answerArea);
  }, {
    onLevel: v => reviewMic.style.setProperty('--level', v.toFixed(2)),
    onState: s => { reviewMic.classList.toggle('working', s === 'transcribing'); reviewMic.innerHTML = s === 'recording' ? ICON.stop : ICON.mic; },
  });
  const boxes = el('div', { class: 'boxes', 'aria-label': `기억 단계 ${c.box}/6` }, ...Array.from({ length: 6 }, (_, k) => el('i', { class: k < c.box ? 'on' : '' })));
  view.replaceChildren(
    el('div', { class: 'review-top' }, el('span', {}, `${rv.i + 1} / ${rv.cards.length}`), el('span', {}, `정답 ${rv.right}`)),
    el('div', { class: 'progress-track' }, el('div', { style: `width:${(rv.i / rv.cards.length) * 100}%` })),
    el('div', { class: 'card rv-card' },
      el('div', { class: 'rv-head' }, el('span', { class: 'chip ' + (isGap ? 'accent' : 'err') }, c.label), boxes),
      isGap
        ? [el('div', { class: 'rv-prompt' }, '이 말을 영어로 해 보세요'), el('div', { class: 'rv-korean' }, c.original), el('div', { class: 'muted', style: 'font-size:14px' }, '원래 문장: ', c.context)]
        : [el('div', { class: 'rv-prompt' }, '밑줄 친 부분을 고쳐서 문장을 말해 보세요'), el('div', { class: 'rv-context' }, highlight(c.context, [c.original]))],
      hint, resultBox, answerArea));
}
async function submitReview(c, text, resultBox, answerArea) {
  if (state.review.answered) return;
  try {
    const r = await api(`/api/cards/${c.id}/attempt`, { json: { text } });
    state.review.answered = true;
    if (r.correct) state.review.right++;
    showReviewResult(c, r.correct, text, resultBox, answerArea, r.card);
  } catch (e) { toast(e.message); }
}
async function giveUp(c, resultBox, answerArea) {
  if (state.review.answered) return;
  state.review.answered = true;
  const r = await api(`/api/cards/${c.id}/grade`, { json: { correct: false } }).catch(() => ({}));
  showReviewResult(c, false, null, resultBox, answerArea, r.card);
}
function showReviewResult(c, correct, heard, resultBox, answerArea, card) {
  answerArea.hidden = true;
  const next = el('button', { class: 'btn primary block', type: 'button', onclick: () => { state.review.i++; renderReview(); } }, state.review.i + 1 < state.review.cards.length ? '다음 →' : '결과 보기');
  const box = el('div', { class: 'rv-result ' + (correct ? 'good' : 'bad') },
    el('div', { class: 'verdict' }, correct ? (card?.mastered ? '✓ 정답 · 완전히 익혔어요!' : '✓ 정답이에요') : (heard ? '✗ 아쉬워요' : '정답은 이거예요')),
    el('div', { class: 'expected' }, c.improved, speakerButton(c.improved)),
    heard && !correct ? el('div', { class: 'heard' }, `내가 말한 것: "${heard}"`) : null,
    c.explain_ko ? el('div', { class: 'why' }, c.explain_ko) : null);
  if (heard && !correct) {
    box.append(el('button', { class: 'override', type: 'button', onclick: async e => {
      await api(`/api/cards/${c.id}/grade`, { json: { correct: true } });
      state.review.right++; e.target.replaceWith(el('span', { class: 'why' }, '맞은 걸로 기록했어요'));
    } }, '맞게 말했는데 잘못 들렸어요'));
  }
  resultBox.replaceChildren(box, el('div', { style: 'height:12px' }), next);
  if (!correct) playTts(c.improved);
}

// ------------------------------------------------------------ growth
async function loadGrowth() {
  const view = $('#growthView');
  view.replaceChildren(el('p', { class: 'muted dots', style: 'text-align:center;margin-top:40px' }, '불러오는 중'));
  try { renderGrowth(await api('/api/progress')); }
  catch (e) { view.replaceChildren(el('div', { class: 'empty' }, el('p', {}, e.message))); }
}
function errorRateChart(sessions) {
  const data = sessions.filter(s => s.words >= 5 && s.error_rate != null);
  if (data.length < 2) return el('p', { class: 'muted', style: 'font-size:14px;margin:8px 0 0' }, '대화를 두 번 이상 하면 오류율 추이가 나타나요.');
  const W = 320, H = 150, padL = 26, padB = 20, padT = 8;
  const max = Math.max(4, ...data.map(d => d.error_rate));
  const nice = Math.ceil(max / 2) * 2;
  const sameDay = new Set(data.map(d => d.date)).size < data.length;
  const slot = (W - padL) / data.length, bw = Math.max(6, Math.min(24, slot - 6));
  const y = v => padT + (H - padT - padB) * (1 - v / nice);
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', '대화별 100단어당 문법 오류 수');
  const add = (tag, attrs, text) => { const n = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text != null) n.textContent = text; svg.append(n); return n; };
  for (const v of [0, nice / 2, nice]) {
    add('line', { class: 'grid-line', x1: padL, x2: W, y1: y(v), y2: y(v) });
    add('text', { class: 'axis-text', x: padL - 6, y: y(v) + 3, 'text-anchor': 'end' }, v);
  }
  const tip = el('div', { class: 'chart-tip' }, '막대를 탭하면 자세히 볼 수 있어요');
  const bars = [];
  data.forEach((d, i) => {
    const cx = padL + slot * i + slot / 2, top = y(d.error_rate), base = y(0), h = Math.max(2, base - top);
    const r = Math.min(4, bw / 2, h);
    // Rounded top, square base anchored to the axis.
    const path = `M${cx - bw / 2},${base} V${base - h + r} Q${cx - bw / 2},${base - h} ${cx - bw / 2 + r},${base - h} H${cx + bw / 2 - r} Q${cx + bw / 2},${base - h} ${cx + bw / 2},${base - h + r} V${base} Z`;
    bars.push(add('path', { class: 'bar', d: path }));
    if (i === 0 || i === data.length - 1 || data.length <= 7) add('text', { class: 'axis-text', x: cx, y: H - 5, 'text-anchor': 'middle' }, sameDay ? d.time : d.date);
    const hit = add('rect', { class: 'bar-hit', x: cx - slot / 2, y: 0, width: slot, height: H });
    const show = () => {
      bars.forEach((b, k) => b.classList.toggle('dim', k !== i));
      tip.textContent = `${d.date} ${d.time} · ${d.words}단어 중 오류 ${d.errors}개 → 100단어당 ${d.error_rate}`;
    };
    hit.addEventListener('pointerenter', show); hit.addEventListener('click', show);
  });
  svg.addEventListener('pointerleave', () => bars.forEach(b => b.classList.remove('dim')));
  const first = data[0].error_rate, last = data[data.length - 1].error_rate;
  const trend = last < first ? `처음보다 ${Math.round((1 - last / (first || 1)) * 100)}% 줄었어요 👏` : last > first ? '최근 오류가 늘었어요 — 더 긴 문장에 도전 중이라면 괜찮아요' : '';
  const table = el('table', { class: 'sr-only' }, el('tr', {}, el('th', {}, '날짜'), el('th', {}, '단어'), el('th', {}, '오류'), el('th', {}, '100단어당')),
    ...data.map(d => el('tr', {}, el('td', {}, d.date), el('td', {}, d.words), el('td', {}, d.errors), el('td', {}, d.error_rate))));
  return el('div', { class: 'chart' }, trend ? el('div', { class: 'sub', style: 'color:var(--ink-2)' }, trend) : null, svg, tip, table);
}
function renderGrowth(p) {
  const tiles = [[`${p.streak}일`, '연속 학습'], [p.words.toLocaleString(), '말한 단어'], [p.turns, '대화 턴'], [`${p.review.mastered}/${p.review.total}`, '익힌 표현']];
  const maxScore = Math.max(1, ...p.weak_points.map(w => w.score));
  const weak = p.weak_points.length
    ? el('div', { class: 'weak-list' }, ...p.weak_points.map(w => {
        const [label, tone] = STATUS[w.status] || ['', ''];
        return el('details', { class: 'weak' },
          el('summary', {},
            el('span', { class: 'name' }, w.label),
            el('span', { class: 'chip ' + tone }, label),
            el('span', { class: 'meta' },
              el('span', { class: 'meter' }, el('div', { style: `width:${(w.score / maxScore) * 100}%` })),
              `최근 ${w.recent}회 · 그 전 ${w.previous}회${w.good_recent ? ` · 맞게 씀 ${w.good_recent}회` : ''}`)),
          el('div', { class: 'examples' }, ...w.examples.map(x => el('div', { class: 'ex' },
            el('div', { class: 'corr-line' }, el('s', {}, x.original), el('span', { class: 'arrow' }, '→'), el('b', {}, x.improved)),
            x.explain_ko ? el('div', { class: 'why' }, x.explain_ko) : null))));
      }))
    : el('div', { class: 'card muted', style: 'font-size:14px' }, '아직 데이터가 없어요. 대화를 하면 자주 틀리는 패턴이 여기에 쌓여요.');
  $('#growthView').replaceChildren(
    el('div', { class: 'stat-grid' }, ...tiles.map(([v, l]) => el('div', { class: 'stat' }, el('b', {}, v), el('span', {}, l)))),
    el('div', { class: 'section-title' }, '문법 오류 추이'),
    el('div', { class: 'card chart-card' }, el('h3', {}, '100단어당 문법 오류'), el('div', { class: 'sub' }, '대화별 · 낮을수록 좋아요'), errorRateChart(p.sessions)),
    el('div', { class: 'section-title' }, '나의 약점 패턴'),
    weak,
    el('p', { class: 'note' }, '최근 15번의 발화와 그 이전 15번을 비교해요. "집중 필요" 항목은 다음 대화에서 Alex가 그 표현을 쓰게 되는 질문을 해요. 맞게 사용하면 점수가 내려가요.'));
}

// ------------------------------------------------------------ start
(async function init() {
  showVoice();
  try {
    await refreshBoot();
  } catch (e) {
    $('#homeView').replaceChildren(el('div', { class: 'empty' }, el('div', { class: 'big' }, '🔌'), el('h3', {}, '서버에 연결할 수 없어요'), el('p', {}, e.message)));

  }

  await restoreSession();
  renderHome();

    history.replaceState({ heyAlex: true, view: 'home' }, '', homeUrl);
    if (initialView === 'chat' && state.session) setTab('talk', { chat: true });
    else if (initialView === 'review' || initialView === 'growth') setTab(initialView);
    else setTab('talk', { navigation: false });
  } else showRoute(history.state.view);
  updateComposer();
  api('/api/health').then(h => { $('#modelInfo').textContent = `모델: ${h.model}`; if (!h.model_available) toast('로컬 모델을 찾을 수 없어요: ' + h.model, 6000); })
    .catch(() => toast('로컬 AI(Ollama)에 연결할 수 없어요.', 6000));
})();
